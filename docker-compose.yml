version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agriportal_postgres
    restart: always
    environment:
      POSTGRES_DB: agriportal
      POSTGRES_USER: agriportal
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agriportal_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agriportal -d agriportal"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agriportal_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    ports:
      - "4000:4000"

volumes:
  pgdata:
